name: Publicar Release do site

on:
  push:
    tags:
      - "site-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verificar o GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          site_url=https://fecasula.github.io/tcc-demografia/
          curl -fsSL --retry 3 --max-time 30 "$site_url" -o "$RUNNER_TEMP/index.html"
          cmp publicacao/index.html "$RUNNER_TEMP/index.html"
          curl -fsSL --retry 3 --max-time 30 "${site_url}publicacao/assets/tcc-felipe-casula.pdf" \
            -o "$RUNNER_TEMP/tcc-felipe-casula.pdf"
          cmp publicacao/assets/tcc-felipe-casula.pdf "$RUNNER_TEMP/tcc-felipe-casula.pdf"
          curl -fsSL --retry 3 --max-time 30 "${site_url}publicacao/sitemap.xml" -o "$RUNNER_TEMP/sitemap.xml"
          cmp publicacao/sitemap.xml "$RUNNER_TEMP/sitemap.xml"

      - name: Anexar o site publicado à Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          git archive --format=zip --output "$RUNNER_TEMP/tcc-site.zip" HEAD:publicacao
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/tcc-site.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Site do TCC ${RELEASE_TAG#site-}" \
            --notes 'Site do TCC de Felipe Casula publicado em https://fecasula.github.io/tcc-demografia/. O arquivo tcc-site.zip contém a versão estática do site, com as figuras, as tabelas e o PDF do trabalho.'
