name: Publicar Release do site

on:
  push:
    tags:
      - "site-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Anexar o site publicado à Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # O commit da publicação registra o commit de origem do site.
          git log -1 --format=%B | grep -Fx "Fonte: $GITHUB_SHA"
          test -s index.html
          test -s assets/tcc-felipe-casula.pdf
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          git archive --format=zip --output "$RUNNER_TEMP/tcc-site.zip" HEAD
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/tcc-site.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Site do TCC ${RELEASE_TAG#site-}" \
            --notes 'Site do TCC de Felipe Casula publicado em https://fecasula.github.io/tcc-demografia/. O arquivo tcc-site.zip contém a versão estática do site, com as figuras, as tabelas e o PDF do trabalho.'
